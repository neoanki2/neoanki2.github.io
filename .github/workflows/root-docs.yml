name: Root documentation

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: root-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build root documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out site publication configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: publication
      - name: Test documentation source selection
        run: python3 publication/Scripts/test-resolve-docs-source.py
      - name: Resolve independently validated documentation source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 publication/Scripts/resolve-docs-source.py
          --config publication/.github/docs-source.json >> "$GITHUB_OUTPUT"
      - name: Check out canonical documentation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neoanki2/neoanki2
          ref: ${{ steps.source.outputs.source_sha }}
          path: source
          fetch-depth: 1
      - name: Validate documentation content
        run: cd source && swift Scripts/validate-docs.swift
      - name: Configure root URL and build metadata
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import re
          import subprocess
          from pathlib import Path

          source = Path("source")
          config = source / "docs" / "_config.yml"
          text = config.read_text(encoding="utf-8")
          text = re.sub(r"^url:.*$", "url: https://neoanki2.github.io", text, flags=re.MULTILINE)
          text = re.sub(r"^baseurl:.*$", 'baseurl: ""', text, flags=re.MULTILINE)
          config.write_text(text, encoding="utf-8")

          sha = subprocess.check_output(
              ["git", "-C", str(source), "rev-parse", "HEAD"], text=True
          ).strip()
          data_directory = source / "docs" / "_data"
          data_directory.mkdir(exist_ok=True)
          metadata = {
              "commit_sha": sha,
              "published_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(timespec="seconds").replace("+00:00", "Z"),
          }
          (data_directory / "build.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./source/docs
          destination: ./_site
      - name: Validate rendered root site
        run: python3 source/Scripts/validate-built-docs.py _site --base-url https://neoanki2.github.io
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa

  deploy:
    name: Deploy root documentation
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
